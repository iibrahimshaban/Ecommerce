<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Product Notification</title>
    <style>
        /* Basic email-safe styling (inline-friendly) */
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: #f4f4f6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(90deg,#0b74de,#0b6fe0);
            color: #fff;
        }

            .header h1 {
                margin: 0;
                font-size: 20px;
            }

        .content {
            padding: 20px;
            color: #333;
            line-height: 1.4;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .meta {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .description {
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .cta {
            display: block;
            text-align: center;
            margin: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            background: #0b74de;
            color: #fff;
            font-weight: 600;
        }

        .footer {
            padding: 14px 20px;
            font-size: 12px;
            color: #888;
            text-align: center;
            background: #fafafa;
        }

        @media (max-width:480px) {
            .container {
                width: 100% !important;
                border-radius: 0;
            }

            .header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container" role="article" aria-label="Product notification">
        <div class="header">
            <h1>New Product Update for {{name}}</h1>
        </div>

        <div class="content">
            <div class="product-title">{{pollTill}}</div>
            <div class="meta">Stock: <strong>{{Stock}}</strong></div>

            <div class="description">
                {{Description}}
            </div>

            <div class="cta">
                <a class="btn" href="{{url}}" target="_blank" rel="noopener">View product</a>
            </div>
        </div>

        <div class="footer">
            You received this message because you are subscribed to product updates.<br />
            © Your Company
        </div>
    </div>
</body>
</html>
